[project]
name = "srt-ollama-translator"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ares Ulises Juárez Martínez", email = "aresulises8@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "srt>=3.5.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
srt-ollama-translator = "srt_ollama_translator:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
